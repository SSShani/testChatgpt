
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <header class="top-bar">

    <a href="index.html" class="brand">
      <img src="logoN.webp" alt="logo" class="brand-icon">
      <span class="brand-name">ChatGPT</span>
    </a>

    <nav class="main-nav">
      <a href="#">About</a>
      <a href="#">Features</a>
      <a href="#">Learn</a>
      <a href="#">Business</a>
      <a href="#">Pricing</a>
      <a href="images.html">Images</a>
      <a href="#">Download</a>
    </nav>

    <div class="actions">
      <a href="#" class="btn btn-dark">Log in</a>
      <a href="#" class="btn btn-outline">Sign up for free</a>
      <button type="button" class="btn-help" >?</button>
    </div>

  </header>

  <main class="content">
    <h1>What's on the agenda today?</h1>

    <form class="ask-box" >
      <input type="text" name="prompt" placeholder="Ask anything">

      <div class="tools">
        <button type="button" class="tool-btn">
  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"/>
  </svg>
  Attach
</button>

<button type="button" class="tool-btn">
  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M3 12h18"/>
    <path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18z"/>
  </svg>
  Search
</button>

<button type="button" class="tool-btn">
  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 5a2 2 0 0 1 2-2h4v18H6a2 2 0 0 1-2-2z"/>
    <path d="M10 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/>
  </svg>
  Study
</button>

<button type="button" class="tool-btn">
  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="5" width="18" height="14" rx="2"/>
    <circle cx="9" cy="10" r="1.5"/>
    <path d="M21 16l-5-5-8 8"/>
  </svg>
  Create image
</button>

<button type="button" class="voice-btn">
  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <path d="M4 10v4"/>
    <path d="M8 6v12"/>
    <path d="M12 9v6"/>
    <path d="M16 4v16"/>
    <path d="M20 10v4"/>
  </svg>
  Voice
</button>  </div>
    </form>
  </main>

</body>
</html>
